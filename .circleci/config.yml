version: 2.1

orbs:
  python: circleci/python@2.1.1
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.12.3-browsers

    steps:
      - checkout

      - browser-tools/install-browser-tools

      - run:
          name: Verify browsers
          command: |
            firefox --version
            google-chrome --version

      - restore_cache:
          keys:
            - pip-cache-{{ checksum "requirements.txt" }}

      - run:
          name: Install dependencies
          command: |
            python --version
            pip install --upgrade pip
            pip install -r requirements.txt

      - save_cache:
          key: pip-cache-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

      - run:
          name: Run Pytest
          command: |
            mkdir -p reports
            pytest --junitxml=reports/results.xml

      - store_test_results:
          path: reports

      - store_artifacts:
          path: reports

workflows:
  test_my_app:
    jobs:
      - build_and_test
